[package]
name = "residiuum-testrig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
authors.workspace = true
description = "Three-prong store stress rig: data pump, filesystem chaos monkey, performance monitor (not a product CLI)."
readme = "README.md"
repository.workspace = true
keywords = ["residiuum", "test", "chaos", "benchmark", "stress"]
categories = ["development-tools", "database"]
publish = false
include = ["Cargo.toml", "README.md", "src/**"]

[[bin]]
name = "residiuum-testrig"
path = "src/main.rs"
doc = false

[[bin]]
name = "residiuum-atomic-qual"
path = "src/bin/residiuum-atomic-qual.rs"
doc = false

[dependencies]
residiuum-store = { workspace = true, features = ["legacy-raw-store"] }
residiuum-format = { workspace = true }
residiuum-sdk.workspace = true
residiuum-heap.workspace = true
residiuum-atomics.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
getrandom.workspace = true
# PEER-SQL: same-bed SQLite peer (diagnostic only; bundled libsqlite for portability).
rusqlite = { version = "0.32", features = ["bundled"] }
