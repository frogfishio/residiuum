[package]
name = "residiuum-atomics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "Residiuum Atomic protocol types: identity, limits, vocabulary, outcomes, and formal lifecycle states."
readme = "README.md"
keywords = ["residiuum", "atomics", "protocol"]
categories = ["data-structures"]
