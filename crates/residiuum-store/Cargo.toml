[package]
name = "residiuum-store"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
authors.workspace = true
description = "Residiuum single-node append store: segments, durability, catalogs, chunks, history, tiers (Stages 3+6+9)."
readme = "README.md"
repository.workspace = true
keywords = ["residiuum", "store", "append-only", "salvage", "durability"]
categories = ["database-implementations", "filesystem"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "crash_matrix.v1.json"]

[features]
# A3 / CPR-001 consistency: package default is façades-only (no public Store).
# Stages 3–9 enable `legacy-raw-store` explicitly (cli/server/cluster/tests).
default = []
# Public unscoped [`Store`] for Stages 3–9 callers. Opt-in for qualified path.
legacy-raw-store = []
# Local-only staged genesis / publish used by `residiuum-authority` (HP-005).
# MUST NOT be enabled in the qualified data-service target.
authority-provisioning = []
# Live AWS KMS data-key connector ([`AwsKmsDataKeyProvider`]). Not default:
# pulls ureq + SigV4 helpers. Uses real KMS HTTPS (or LocalStack endpoint).
# PKCS#11 remains scaffold-only in this cut.
aws-kms = ["dep:ureq", "dep:hmac", "dep:sha2", "dep:hex"]

[dependencies]
residiuum-format.workspace = true
residiuum-heap.workspace = true
residiuum-atomics.workspace = true
thiserror.workspace = true
blake3.workspace = true
getrandom.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

# Multi-process crash harness for DEF-022 (not a product CLI).
[[bin]]
name = "residiuum-store-crash-child"
path = "src/bin/crash_child.rs"
doc = false
required-features = ["legacy-raw-store"]

