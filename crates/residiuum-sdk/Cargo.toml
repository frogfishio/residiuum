[package]
name = "residiuum-sdk"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
# MPL-2.0 for embedded + remote. Enabling the `cluster` feature pulls AGPL
# `residiuum-cluster` (in-process multi-node); see doc/reference/operations/LICENSING.md.
license = "MPL-2.0"
authors.workspace = true
description = "Residiuum collection SDK: embedded open, remote connect, filters, indexes, history (Stages 4+6+7). Optional cluster via feature."
readme = "README.md"
repository.workspace = true
keywords = ["residiuum", "sdk", "embedded", "json", "database"]
categories = ["database", "api-bindings"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[features]
# CPR-001 closed for default product profile: package default is **heap-only**
# (deployment + HeapCap + connect_heap). Stages 3–9 flat surface is opt-in via
# `legacy-flat-sdk` (or `cluster`, which implies it).
default = []
# Flat `Residiuum::open` / `collection(name)` / token remote / raw Store access.
# Pulls public `residiuum-store` `legacy-raw-store`. Not part of Gate H6 claims.
legacy-flat-sdk = ["residiuum-store/legacy-raw-store"]
# In-process multi-node (`Residiuum::open_cluster` / `create_cluster`) via AGPL residiuum-cluster.
# Implies the flat SDK (cluster routing uses the same collection surface).
cluster = ["dep:residiuum-cluster", "legacy-flat-sdk"]
# Reference in-memory Ed25519 holder key for tests/dev only (`HEAP_SPEC` §30.9).
# Does not enable secret-export APIs beyond construction from a seed.
dangerous-key-export = ["dep:ed25519-dalek"]

[dependencies]
residiuum-client.workspace = true
# Public `Store` only with `legacy-flat-sdk` → `residiuum-store/legacy-raw-store` (CPR-001 / HP-003).
residiuum-store = { workspace = true }
residiuum-heap.workspace = true
residiuum-format.workspace = true
residiuum-cluster = { workspace = true, optional = true }
sda-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
getrandom.workspace = true
ed25519-dalek = { version = "2.1.1", optional = true, default-features = false, features = [
  "alloc",
  "fast",
  "zeroize",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = "0.16"

[dev-dependencies]
# No residiuum-server here: server → sdk is a normal dep, so a crates.io cycle
# would block publish. TCP/serve integration tests live in `residiuum-server/tests/`.
residiuum-cluster = { workspace = true }
tempfile.workspace = true
rcgen = "0.13"
ed25519-dalek = { version = "2.1.1", default-features = false, features = [
  "alloc",
  "fast",
  "zeroize",
] }
hex = "0.4"

# In-process cluster tests (no TCP serve) need the AGPL `cluster` feature.
[[test]]
name = "stage8e_find_coverage"
required-features = ["cluster"]

[[test]]
name = "cpr001_legacy_opt_in"
# Flat surface opt-in (default package profile is heap-only after CPR-001 flip).
required-features = ["legacy-flat-sdk"]

[[test]]
name = "stage4_collection"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "stage6_indexes_history"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "stage_def_027_index_lifecycle"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "stage_def_028_filter_sda"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "stage_def_029_resource_governance"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "dialects_query"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "multi_collection_sda_join"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "multi_query_join_sda"
required-features = ["legacy-flat-sdk"]

[[test]]
name = "sda_enr_text_query"
required-features = ["legacy-flat-sdk"]
