[workspace]
members = [
  "crates/sda-core",
  "crates/sda-cli",
  "crates/residiuum-format",
  "crates/residiuum-heap",
  "crates/residiuum-authority",
  "crates/residiuum-store",
  "crates/residiuum-store-model",
  "tools/core-storage-reference-reader",
  "crates/residiuum-perf",
  "crates/residiuum-rql-qual",
  "crates/residiuum-client",
  "crates/residiuum-sdk",
  "crates/residiuum-server",
  "crates/residiuum-examine",
  "crates/residiuum-cli",
  "crates/residiuum-cluster",
  "crates/residiuum-testrig",
  "verification/heap-verus",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
# DEF-090 MSRV: keep in sync with .github/workflows/ci.yml `msrv` job and
# CONTRIBUTING.md. Bump deliberately when a dependency or language feature
# requires a newer compiler (`is_multiple_of` needs ≥1.87).
rust-version = "1.88.0"
# Multi-tier licensing (not a single workspace license). Per-crate SPDX in
# each package; policy in doc/reference/operations/LICENSING.md. MIT was temporary scaffolding only.
authors = ["Alexander R. Croft"]
repository = "https://github.com/frogfishio/dingodb"

[workspace.dependencies]
# Directory is crates/sda-core; published package name is residiuum-sda (not bare
# `sda` / `sda-lib` — those crates.io names must not be reused). Dependents that
# use the workspace key import as `sda_core`. Inside the package, the crate path
# is `residiuum_sda`. `version` is required so `cargo package` can rewrite path deps.
sda-core = { package = "residiuum-sda", path = "crates/sda-core", version = "0.2.2" }
residiuum-format = { path = "crates/residiuum-format", version = "0.2.2" }
residiuum-heap = { path = "crates/residiuum-heap", version = "0.2.2" }
residiuum-authority = { path = "crates/residiuum-authority", version = "0.2.2" }
# default-features false: public raw `Store` is opt-in via `legacy-raw-store`
# (HP-003 / CPR-001). Dependents that need Stages 3–9 flat store enable the feature.
residiuum-store = { path = "crates/residiuum-store", version = "0.2.3", default-features = false }
residiuum-store-model = { path = "crates/residiuum-store-model", version = "0.2.2" }
residiuum-client = { path = "crates/residiuum-client", version = "0.2.3" }
residiuum-sdk = { path = "crates/residiuum-sdk", version = "0.2.3" }
residiuum-server = { path = "crates/residiuum-server", version = "0.2.2" }
residiuum-examine = { path = "crates/residiuum-examine", version = "0.2.2" }
residiuum-cluster = { path = "crates/residiuum-cluster", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
blake3 = "1"
crc32c = "0.6"
getrandom = "0.3"
tempfile = "3"
# Lightweight HTTP for optional AWS KMS connector (residiuum-store `aws-kms`).
ureq = { version = "2", default-features = false, features = ["tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
